<canvas id="clickSparkCanvas"></canvas>

<script>
(() => {
  const sparkColor = getComputedStyle(document.documentElement).getPropertyValue('--button-secondary-text').trim();
  const sparkSize = 10;
  const sparkRadius = 15;
  const sparkCount = 8;
  const duration = 400;
  const easing = "ease-out";

  const canvas = document.getElementById("clickSparkCanvas");
  const ctx = canvas.getContext("2d");
  const sparks = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  Object.assign(canvas.style, {
    position: "fixed",
    top: 0,
    left: 0,
    width: "100%",
    height: "100%",
    zIndex: 9999,
    pointerEvents: "none",
  });

  function easeFunc(t) {
    return t * (2 - t);
  }

  function draw(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const now = performance.now();

    for (let i = sparks.length - 1; i >= 0; i--) {
      const spark = sparks[i];
      const elapsed = now - spark.startTime;
      if (elapsed >= duration) {
        sparks.splice(i, 1);
        continue;
      }

      const progress = elapsed / duration;
      const eased = easeFunc(progress);

      const distance = eased * sparkRadius;
      const lineLength = sparkSize * (1 - eased);

      const x1 = spark.x + distance * Math.cos(spark.angle);
      const y1 = spark.y + distance * Math.sin(spark.angle);
      const x2 = spark.x + (distance + lineLength) * Math.cos(spark.angle);
      const y2 = spark.y + (distance + lineLength) * Math.sin(spark.angle);

      ctx.strokeStyle = sparkColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    if (sparks.length > 0) requestAnimationFrame(draw);
  }

  document.addEventListener("click", (e) => {
    const x = e.clientX;
    const y = e.clientY;

    const now = performance.now();
    for (let i = 0; i < sparkCount; i++) {
      sparks.push({
        x,
        y,
        angle: (2 * Math.PI * i) / sparkCount,
        startTime: now,
      });
    }

    if (sparks.length === sparkCount) {
      requestAnimationFrame(draw);
    }
  });
})();
</script>
